
name: Feature Request
description: Suggest a new feature or improvement for OmniMirror.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve OmniMirror?
        Share your suggestion below.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Explain the problem or limitation.
      placeholder: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: Explain your proposed feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative solutions?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Screenshots, examples, or references.
    validations:
      required: false
